name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-julia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          profile: minimal

      - name: Set up Julia
        uses: julia-actions/setup-julia@v1
        with:
          version: "1.10"

      - name: Install JSON3.jl
        run: julia -e 'import Pkg; Pkg.add("JSON3")'

      - name: Build (release-safe)
        run: cargo build --profile release-safe --locked

      - name: Run trace tests
        run: |
          cd julia-tests
          RECUR_PROFILE=release-safe julia runtests.trace.jl

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          profile: minimal

      - name: Build (release-safe)
        run: cargo build --profile release-safe --locked

      - name: Upload Windows binary
        uses: actions/upload-artifact@v4
        with:
          name: recur-windows-release-safe
          path: target/release-safe/recur.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          profile: minimal

      - name: Build (release-safe)
        run: cargo build --profile release-safe --locked

      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: recur-linux-release-safe
          path: target/release-safe/recur

  docker:
    runs-on: ubuntu-latest
    needs: test-julia
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha
            type=ref,event=branch

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
