name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          profile: minimal

      - name: Build (release-safe)
        run: cargo build --profile release-safe --locked

      - name: Package Windows zip
        shell: pwsh
        run: |
          python scripts/check_lang_package.py --bin-dir target/release-safe --output-dir artifacts --platform windows

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: |
            artifacts/recur-*.zip
            artifacts/windows-package-smoke.json

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.85.0
        with:
          profile: minimal

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package Linux tarball
        run: |
          python3 scripts/check_lang_package.py --bin-dir target/release --output-dir artifacts --platform linux

      - name: Build .deb package
        if: github.event_name == 'push'
        run: |
          cargo install cargo-deb
          cargo deb --no-build

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: linux-tarball
          path: |
            artifacts/recur-*.tar.gz
            artifacts/linux-package-smoke.json

      - name: Upload deb
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: target/debian/*.deb

  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: clippy
      - uses: julia-actions/setup-julia@v1
        with:
          version: "1.10"
      - name: Rust regression and lint evidence
        run: |
          mkdir validation
          cargo test --locked 2>&1 | tee validation/rust.log
          cargo clippy --locked --all-targets 2>&1 | tee validation/clippy.log
      - name: Julia regression evidence
        run: |
          julia -e 'import Pkg; Pkg.add("JSON3")'
          RECUR_BIN="$PWD/target/debug/recur" RECUR_PROFILE=debug julia julia-tests/runtests.jl 2>&1 | tee validation/julia.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-logs
          path: validation/*.log

  release:
    if: github.event_name == 'push'
    needs: [build-windows, build-linux, regression]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows-zip/*.zip
            artifacts/linux-tarball/*.tar.gz
            artifacts/linux-deb/*.deb

  chocolatey:
    needs: [release]
    runs-on: windows-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows zip
        uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: artifacts

      - name: Pack Chocolatey package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $zip = Get-ChildItem artifacts/*.zip | Select-Object -First 1
          ./scripts/pack_choco_release.ps1 -Version $version -ZipPath $zip.FullName -OutputDirectory choco

      - name: Push to Chocolatey
        shell: pwsh
        run: |
          $nupkg = Get-ChildItem choco/*.nupkg | Select-Object -First 1
          Write-Host "Pushing $($nupkg.FullName)"
          choco push $nupkg.FullName --source https://push.chocolatey.org/ --api-key ${{ secrets.CHOCOLATEY_API_KEY }}
